name: Release-Please

on:
    push:
        branches:
            - main
            - staging

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        steps:
            - uses: google-github-actions/release-please-action@v4
              id: release
              with:
                  # This assumes you are releasing a Node.js-based project
                  release-type: node
                  package-name: netpub-ugc-video
